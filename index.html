<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale Wizard</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Scale Wizard</h1>
            <button class="theme-toggle" id="theme-btn" title="Toggle Dark/Light Mode">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </header>
        
        <main>
            <div class="controls-wrapper" style="display: flex; gap: 1rem; flex-wrap: nowrap; margin-bottom: 3rem;">
                <!-- Panel 1: Music Context -->
                <section class="controls panel glass" style="flex: 0 1 auto; min-width: 0; justify-content: flex-start;">
                    <div class="control-group">
                        <div style="display: flex; gap: 0.5rem; align-items: stretch; height: 100%;">
                            <input type="hidden" id="root-note" value="A">
                            <button id="key-select-btn" class="key-select-btn" title="Click to change Key (Tonalidade)">🔑 Key: A Major</button>
                            <button id="drone-btn" class="drone-btn" title="Toggle Drone">▶️</button>
                        </div>
                    </div>
                    
                    <div class="control-group" style="justify-content: flex-end;">
                        <button id="random-btn" class="drone-btn" title="Randomize Scale" style="height: 42.4px;">🎲</button>
                    </div>

                    <div class="control-group" id="scale-select-group">
                        <select id="scale-select">
                            <option value="none">-- Select Scale --</option>
                            <optgroup label="Greek Modes (Brightest ➔ Darkest)">
                                <option value="Lydian">☀️ Lydian</option>
                                <option value="Major (Ionian)" selected>Major (Ionian)</option>
                                <option value="Mixolydian">Mixolydian</option>
                                <option value="Dorian">Dorian</option>
                                <option value="Minor (Aeolian)">Minor (Aeolian)</option>
                                <option value="Phrygian">Phrygian</option>
                                <option value="Locrian">🌑 Locrian</option>
                            </optgroup>
                            <optgroup label="Other Scales">
                                <option value="Minor Pentatonic">Minor Pentatonic</option>
                                <option value="Major Pentatonic">Major Pentatonic</option>
                                <option value="Blues">Blues</option>
                                <option value="Melodic Minor">Melodic Minor</option>
                                <option value="Harmonic Minor">Harmonic Minor</option>
                                <option value="Whole Tone">Whole Tone</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="control-group" id="chord-select-group">
                        <select id="chord-select">
                            <option value="none" selected>-- Select Chord --</option>
                            <optgroup label="Triads">
                                <option value="Major">Major</option>
                                <option value="Minor">Minor</option>
                                <option value="Diminished">Diminished</option>
                                <option value="Augmented">Augmented</option>
                                <option value="sus2">sus2</option>
                                <option value="sus4">sus4</option>
                            </optgroup>
                            <optgroup label="Sevenths">
                                <option value="Maj7">Major 7 (Maj7)</option>
                                <option value="Min7">Minor 7 (Min7)</option>
                                <option value="Dom7">Dominant 7 (Dom7)</option>
                                <option value="m7b5">Half-Diminished (m7b5)</option>
                                <option value="dim7">Diminished 7 (dim7)</option>
                                <option value="mMaj7">Minor-Major 7 (mMaj7)</option>
                                <option value="Maj7#5">Augmented Major 7 (Maj7#5)</option>
                            </optgroup>
                            <optgroup label="Extended Chords">
                                <option value="9">Dominant 9</option>
                                <option value="Maj9">Major 9 (Maj9)</option>
                                <option value="Min9">Minor 9 (Min9)</option>
                                <option value="11">Dominant 11</option>
                                <option value="Min11">Minor 11</option>
                                <option value="13">Dominant 13</option>
                                <option value="Maj13">Major 13</option>
                                <option value="Min13">Minor 13</option>
                                <option value="add9">add9</option>
                                <option value="madd9">madd9</option>
                                <option value="6">Major 6</option>
                                <option value="m6">Minor 6</option>
                                <option value="6/9">6/9</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="control-group" id="inversion-group" style="display: none;">
                        <select id="inversion-select">
                            <option value="0" selected>Root Position</option>
                            <option value="1">1st Inversion (3rd)</option>
                            <option value="2">2nd Inversion (5th)</option>
                            <option value="3">3rd Inversion (7th)</option>
                            <option value="4">4th Inversion (9th)</option>
                            <option value="5">5th Inversion (11th)</option>
                            <option value="6">6th Inversion (13th)</option>
                        </select>
                    </div>
                </section>

                <!-- Panel 2: View Context -->
                <section class="controls panel glass" style="flex: 1 1 auto; min-width: 0; justify-content: flex-start;">
                    <!-- Instrument view selector removed -->

                    <div class="control-group">
                        <label>Highlight Root</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="show-root" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="control-group">
                        <label for="shape-select">Position/Shape</label>
                        <select id="shape-select">
                            <option value="all" selected>All</option>
                            <optgroup label="Generic Windows">
                                <option value="1">Position 1</option>
                                <option value="2">Position 2</option>
                                <option value="3">Position 3</option>
                                <option value="4">Position 4</option>
                                <option value="5">Position 5</option>
                            </optgroup>
                            <optgroup label="CAGED Shapes (Standard)" id="caged-optgroup">
                                <option value="caged_c">C Shape (Pos 1)</option>
                                <option value="caged_a">A Shape (Pos 2)</option>
                                <option value="caged_g">G Shape (Pos 3)</option>
                                <option value="caged_e">E Shape (Pos 4)</option>
                                <option value="caged_d">D Shape (Pos 5)</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="key-labels">Key Labels</label>
                        <select id="key-labels">
                            <option value="notes" selected>Notes</option>
                            <option value="intervals">Intervals</option>
                            <option value="none">None</option>
                        </select>
                    </div>
                </section>
            </div>
            
            <div id="fret-context-wrapper" style="margin-bottom: 3rem;">
                <section class="advanced-settings panel glass" style="margin-bottom: 0.5rem; justify-content: flex-start;">
                <div class="control-group">
                    <label>Orientation Left</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="left-handed">
                        <span class="slider"></span>
                    </label>
                </div>
                
                <div class="control-group">
                    <select id="wood-type">
                        <option value="rosewood">Rosewood</option>
                        <option value="maple">Maple</option>
                        <option value="ebony" selected>Ebony</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <select id="string-count">
                        <option value="ukulele">Ukulele</option>
                        <option value="4">Bass (4 Strings)</option>
                        <option value="5">Bass (5 Strings)</option>
                        <option value="6" selected>Guitar (6 Strings)</option>
                        <option value="7">Guitar (7 Strings)</option>
                        <option value="8">Guitar (8 Strings)</option>
                    </select>
                </div>

                <div class="control-group">
                    <select id="tuning-preset">
                        <option value="custom" hidden>Custom</option>
                        <optgroup label="6-String">
                            <option value="standard" selected>Standard E</option>
                            <option value="drop_d">Drop D</option>
                            <option value="drop_c">Drop C</option>
                            <option value="dadgad">DADGAD</option>
                            <option value="open_d">Open D</option>
                            <option value="open_g">Open G</option>
                        </optgroup>
                        <optgroup label="7-String">
                            <option value="standard_7">Standard B (7)</option>
                            <option value="drop_a_7">Drop A (7)</option>
                        </optgroup>
                        <optgroup label="8-String">
                            <option value="standard_8">Standard F# (8)</option>
                            <option value="drop_e_8">Drop E (8)</option>
                        </optgroup>
                    </select>
                </div>
                
                <div class="control-group" style="margin-left: auto;">
                    <label class="toggle-switch" title="Toggle Guitar Visibility">
                        <input type="checkbox" id="toggle-guitar" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </section>
            
            <section class="fretboard-container glass" id="fretboard-wrapper">
                <div class="fretboard" id="fretboard">
                    <!-- Fretboard will be injected here via JS -->
                </div>
            </section>
            </div>

            <div id="piano-context-wrapper" style="display: block; margin-bottom: 3rem;">
                <section class="advanced-settings panel glass" id="piano-settings" style="margin-bottom: 0.5rem; justify-content: flex-start;">
                <div class="control-group">
                    <select id="piano-theme">
                        <option value="classic" selected>Classic</option>
                        <option value="synth">Synth (Neon)</option>
                        <option value="rhodes">Vintage Rhodes</option>
                        <option value="matrix">Matrix Hacker</option>
                    </select>
                </div>

                <div class="control-group" style="margin-left: auto;">
                    <label class="toggle-switch" title="Toggle Piano Visibility">
                        <input type="checkbox" id="toggle-piano" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                </section>
    
                <section class="piano-wrapper glass" id="piano-wrapper" style="padding: 1.5rem; overflow-x: auto;">
                <div class="piano" id="piano-container">
                    <!-- Piano will be injected here via JS -->
                </div>
                </section>
            </div>

            <div id="sheet-music-context-wrapper" style="display: block; margin-bottom: 3rem;">
                <section class="advanced-settings panel glass" id="sheet-music-settings" style="margin-bottom: 0.5rem; justify-content: flex-start;">
                <div class="control-group">
                    <select id="clef-select">
                        <option value="auto" selected>💡 Auto Clef</option>
                        <option value="treble">𝄞 Treble Clef (Guitar/Solo)</option>
                        <option value="bass">𝄢 Bass Clef (Bass/Low)</option>
                        <option value="grand">🎹 Grand Staff (Piano/Full)</option>
                    </select>
                </div>

                <div class="control-group" style="margin-left: auto;">
                    <label class="toggle-switch" title="Toggle Sheet Music Visibility">
                        <input type="checkbox" id="toggle-sheet-music-local" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                </section>

                <section class="sheet-music-wrapper glass" id="sheet-music-wrapper" style="padding: 1.5rem; overflow-x: auto;">
                    <div id="sheet-music-container" style="text-align: center; display: flex; justify-content: center; align-items: center; min-height: 120px;">
                        <!-- Sheet Music will be injected here via JS -->
                    </div>
                </section>
            </div>

            <div id="circle-fifths-context-wrapper" style="display: block; margin-bottom: 3rem;">
                <section class="advanced-settings panel glass" id="circle-fifths-settings" style="margin-bottom: 0.5rem; justify-content: flex-start;">
                <div class="control-group">
                    <span style="font-weight: 500; font-family: 'Outfit', sans-serif;">⭕ Circle of Fifths</span>
                </div>

                <div class="control-group" style="margin-left: auto;">
                    <label class="toggle-switch" title="Toggle Circle of Fifths Visibility">
                        <input type="checkbox" id="toggle-circle-fifths-local" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                </section>

                <section class="sheet-music-wrapper glass" id="circle-fifths-wrapper" style="padding: 2rem; display: flex; justify-content: center; align-items: center; overflow-x: auto;">
                    <div id="circle-fifths-container" style="max-width: 500px; width: 100%; text-align: center;">
                        <!-- Circle of Fifths will be injected here via JS -->
                    </div>
                </section>
            </div>

            <!-- Harmonic Field Section -->
            <div id="harmonic-field-context-wrapper" style="display: block; margin-bottom: 3rem;">
                <section class="advanced-settings panel glass" id="harmonic-field-settings" style="margin-bottom: 0.5rem; justify-content: flex-start;">
                    <div class="control-group">
                        <span style="font-weight: 500; font-family: 'Outfit', sans-serif;">🎹 Campo Harmônico (Scale Chords)</span>
                    </div>

                    <div class="control-group" style="margin-left: 2rem;">
                        <select id="harmonic-chord-size">
                            <option value="triads" selected>Tríades (Triads)</option>
                            <option value="tetrads">Tétrades (7ths)</option>
                            <option value="9ths">Chords with 9th</option>
                            <option value="11ths">Chords with 11th</option>
                            <option value="13ths">Chords with 13th</option>
                        </select>
                    </div>

                    <div class="control-group" style="margin-left: auto;">
                        <label class="toggle-switch" title="Toggle Harmonic Field Visibility">
                            <input type="checkbox" id="toggle-harmonic-field-local" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </section>

                <section class="sheet-music-wrapper glass" id="harmonic-field-wrapper" style="padding: 1.5rem; overflow-x: auto;">
                    <div id="harmonic-field-container" class="harmonic-field-grid">
                        <!-- Harmonic field chords will be injected here via JS -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modal for Circle of Fifths Key Selector -->
    <div id="circle-modal" class="modal-overlay">
        <div class="modal-content text-center">
            <button class="modal-close" id="modal-close-btn">&times;</button>
            <h2 class="modal-title">Select Key (Tonalidade)</h2>
            <div id="modal-circle-container" style="max-width: 500px; width: 100%; text-align: center;"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="models/MusicTheory.js"></script>
    <script src="models/Fretboard.js"></script>
    <script src="views/FretboardView.js"></script>
    <script src="views/PianoView.js"></script>
    <script src="views/SheetMusicView.js"></script>
    <script src="views/CircleOfFifthsView.js"></script>
    <script src="views/HarmonicFieldView.js"></script>
    <script src="app.js"></script>
</body>
</html>
